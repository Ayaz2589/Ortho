# Supabase migrations — VALIDATE migration files (prod apply lives in web-deploy.yml).
#
# WHY THIS EXISTS: on 2026-07-19 prod went down with "column transactions.notes
# does not exist" — Vercel had shipped `main` to production while the prod database
# silently sat EIGHT migrations behind (migrations were applied by hand, and got
# forgotten). Two things now prevent a recurrence:
#
#   • validate (THIS file) — on every PR + push: rejects duplicate migration
#     versions and malformed filenames (a duplicate version collides in supabase's
#     schema_migrations tracking; that exact bug — three files at 20260718120000 —
#     shipped and this check catches it).
#   • APPLY-then-DEPLOY — prod migrations are applied by web-deploy.yml, which runs
#     `supabase db push` and THEN deploys the web app in the same run, so the schema
#     always lands before the code (closing the race this file used to leave open).
#
# This file no longer writes to prod — see web-deploy.yml for the prod migrate+deploy
# pipeline (and its SUPABASE_* secrets/var). Staging: supabase-migrations-staging.yml.

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  # Never cancel a mid-flight prod migration.
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject bad filenames + duplicate versions
        run: |
          set -euo pipefail
          cd supabase/migrations
          shopt -s nullglob
          fail=0

          # 1. Every migration must be <14-digit-version>_<name>.sql
          for f in *.sql; do
            if [[ ! "$f" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error file=supabase/migrations/$f::Bad migration filename — must be <14-digit-version>_<name>.sql"
              fail=1
            fi
          done

          # 2. No two migrations may share a version prefix (would collide in
          #    supabase_migrations.schema_migrations and get skipped/errored).
          dupes="$(for f in *.sql; do echo "${f%%_*}"; done | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version(s) — renumber so each is unique:"
            echo "$dupes"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then echo "Migrations OK: $(ls -1 *.sql | wc -l | tr -d ' ') files, all uniquely versioned."; fi
          exit "$fail"

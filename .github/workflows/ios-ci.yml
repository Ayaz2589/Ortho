# iOS CI — manual smoke build for the FROZEN native Ortho-iOS app.
#
# spec 021 (Capacitor iOS consolidation): iOS/Ortho-iOS/ is retired — no new
# feature work lands there, and its 11 XCTest parity suites are no longer kept
# honest by a live second implementation (the web/TypeScript side is now the
# sole canonical one; see PARITY.md and the constitution's Principle VI). Left
# running on every push/PR, this would produce permanent, misleading red the
# next time any vectored web function changes, since nobody updates the frozen
# Swift mirrors. Narrowed to workflow_dispatch-only and build-only (no
# `xcodebuild test`) so it stays a genuine "does the frozen app still compile"
# rollback-readiness check (FR-021) without asserting parity it can no longer
# track. iOS's LIVE feedback loop is now .github/workflows/capacitor-ios-ci.yml.
name: iOS CI (frozen app — manual)

on:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build only (frozen app, manual smoke check)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      # The app never touches the network at compile time — dummy Supabase
      # values are enough for this build-only smoke check.
      - name: Create SupabaseConfig.swift from template
        run: |
          sed -e 's|https://YOUR-PROJECT-REF.supabase.co|https://ci-placeholder.supabase.co|' \
              -e 's|sb_publishable_\.\.\.|sb_publishable_ci_placeholder|' \
              iOS/Ortho-iOS/App/SupabaseConfig.swift.template \
              > iOS/Ortho-iOS/App/SupabaseConfig.swift

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('iOS/Ortho-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for devs in devices.values() for d in devs
                     if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not iphones:
              sys.exit("no available iPhone simulator on this runner")
          # Prefer a mainstream-size device: name sorting made [-1] pick an
          # SE, whose 375pt width is a layout edge case, not the baseline.
          import re
          plain = [d for d in iphones if re.fullmatch(r"iPhone \d+", d["name"])]
          pro = [d for d in iphones if "Pro" in d["name"] and "Max" not in d["name"]]
          pick = (plain or pro or iphones)[-1]
          print(pick["udid"])
          ')"
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Build only — no `xcodebuild test`. The 11 XCTest parity suites assert
      # golden vectors that only the web/TypeScript side still updates; with
      # no live Swift mirror keeping them honest, running them here would be
      # noise, not signal. This step answers one question only: does the
      # frozen app still compile (the FR-021 rollback-readiness check)?
      - name: Build (smoke check)
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            FILTER=(xcbeautify --renderer github-actions)
          else
            FILTER=(cat)
          fi
          xcodebuild build \
            -project iOS/Ortho-iOS.xcodeproj \
            -scheme Ortho-iOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath spm-packages \
            -derivedDataPath DerivedData \
            2>&1 | "${FILTER[@]}"

      # Visual evidence: boot the app in the simulator in DEBUG -uiDemo mode
      # (sample data, no auth/server) and screenshot each tab. The build is
      # incremental on top of the test step's DerivedData.
      - name: Capture sample-state screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find DerivedData/Build/Products -type d -name 'Ortho-iOS.app' | head -1)
          echo "App bundle: $APP"
          BUNDLE_ID=$(defaults read "$PWD/$APP/Info" CFBundleIdentifier)
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          # snap <lang> <tab> — 'en' launches without a language override;
          # other codes ride the DEBUG -uiDemoLanguage argument so every
          # localization is visually reviewable from the artifact.
          snap() {
            local L="$1" TAB="$2"
            local ARGS=(-uiDemo -uiDemoTab "$TAB")
            if [ "$L" != "en" ]; then ARGS+=(-uiDemoLanguage "$L"); fi
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "${ARGS[@]}"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/$L-$TAB.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          }
          for TAB in dashboard transactions housing settings; do snap en "$TAB"; done
          for L in bn es ja zh-Hans ko; do snap "$L" dashboard; snap "$L" settings; done
          for L in bn ja; do snap "$L" transactions; snap "$L" housing; done
          # Scan flow (spec 014): -uiDemoScan feeds a bundled fixture through
          # the REAL parse pipeline (contracts/uidemo-scan.md). The receipt
          # shot shows the prefilled form + Guessed markers + duplicate line;
          # the statement fixture covers interstitial / wizard row / summary.
          # OCR + sheet presentation need a beat longer than the tab shots.
          snap_scan() {
            local L="$1" FIXTURE="$2" STEP="$3" NAME="$4"
            local ARGS=(-uiDemoScan "$FIXTURE")
            if [ -n "$STEP" ]; then ARGS+=(-uiDemoScanStep "$STEP"); fi
            if [ "$L" != "en" ]; then ARGS+=(-uiDemoLanguage "$L"); fi
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "${ARGS[@]}"
            sleep 10
            xcrun simctl io "$UDID" screenshot "screenshots/$L-scan-$NAME.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          }
          for L in en bn es ja zh-Hans ko; do snap_scan "$L" receipt-duplicate "" receipt; done
          # Forgiving fallback tier (post-T037): unlabeled total prefills
          # best-effort with Guessed tags on merchant, amount, AND date.
          snap_scan en receipt-no-total "" fallback
          for L in en bn ja; do
            snap_scan "$L" statement-card ""        interstitial
            snap_scan "$L" statement-card row       row
            snap_scan "$L" statement-card summary   summary
          done
          ls -la screenshots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
          if-no-files-found: error
